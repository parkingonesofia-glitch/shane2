      <h1>Общи условия — Parking One</h1>
      <p>Тези общи условия регулират ползването на услугите на <strong>"Ю Транс" ЕООД</strong>, ЕИК 207838282, оперираща паркинг под търговското наименование <strong>Parking One</strong>, с адрес: Улица Източна Тангента 23, София, България.</p>

      <h2>1. Услуга</h2>
      <p>Parking One предоставя охранявано паркиране за моторни превозни средства в близост до Летище София, с безплатен трансфер до Терминал 1 и Терминал 2. Паркингът работи 24 часа в денонощието, 7 дни в седмицата.</p>

      <h2>2. Резервация</h2>
      <p>Резервацията се извършва онлайн чрез сайта или по телефон на <a href="tel:+359877109788">+359 877 109 788</a>. Резервацията е предварителна и подлежи на наличност. След потвърждение клиентът получава имейл с адрес и инструкции за пристигане.</p>

      <h2>3. Цени и плащане</h2>
      <p>Цените се определят според броя на дните на престой съгласно актуалния ценоразпис на сайта. Плащането се извършва на място при пристигане — в брой или с банкова карта. Не се изисква предплащане.</p>
      <p>За престой над 30 дни цената е 103 € + 2.80 € за всеки допълнителен ден.</p>

      <h2>4. Отмяна и неявяване</h2>
      <p>Резервацията може да се отмени безплатно до 24 часа преди датата на пристигане. Тъй като не се изисква предплащане, не се дължи компенсация при отмяна. При неявяване без уведомление резервацията се анулира автоматично.</p>

      <h2>5. Отговорност</h2>
      <p>Parking One осигурява видеонаблюдение 24/7 и жива охрана. Дружеството не носи отговорност за щети, причинени от непреодолима сила, кражба от трети лица при отключени превозни средства или за ценности, оставени в автомобила.</p>
